<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom & Hazard Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Symptom & Hazard Tracker</h1>

        <!-- Add Record Section -->
        <div id="add-record-card" class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Add New Record</h2>
            <form id="add-record-form">
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Patient Name:</label>
                    <input type="text" id="name" name="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
                </div>

                <div class="mb-4">
                    <label for="date-type" class="block text-gray-700 text-sm font-bold mb-2">Record Date:</label>
                    <select id="date-type" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        <option value="current">Current Date & Time</option>
                        <option value="custom">Custom Date & Time</option>
                    </select>
                </div>

                <div id="custom-date-fields" class="mb-4 hidden">
                    <label for="custom-date" class="block text-gray-700 text-sm font-bold mb-2">Custom Date & Time:</label>
                    <input type="datetime-local" id="custom-date" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>

                <div class="mb-4">
                    <label for="symptoms" class="block text-gray-700 text-sm font-bold mb-2">Symptoms (comma-separated):</label>
                    <input type="text" id="symptoms" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>

                <div class="mb-6">
                    <label for="hazards" class="block text-gray-700 text-sm font-bold mb-2">Hazards (comma-separated):</label>
                    <input type="text" id="hazards" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>

                <div class="flex items-center justify-between">
                    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Add Record</button>
                    <span id="add-status" class="text-sm text-green-600 hidden">Record added!</span>
                </div>
            </form>
        </div>

        <!-- Manage Records Section -->
        <div id="manage-records-card" class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Manage Records</h2>
            <div class="flex space-x-4 mb-4">
                <button id="view-records" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">View All Records</button>
                <button id="delete-all-records" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Delete All Records</button>
            </div>

            <div id="records-container" class="mt-4">
                <p class="text-gray-500" id="records-placeholder">Click 'View All Records' to see the database content.</p>
                <div id="records-table-container" class="overflow-x-auto">
                    <!-- Records will be displayed here as a table -->
                </div>
            </div>
        </div>
    </div>

</body>
</html>
